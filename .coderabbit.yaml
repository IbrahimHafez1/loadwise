# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  # Skipped reviews (rebases that bring no new changes) would otherwise each post a "Review skipped" comment.
  review_status: false
  auto_review:
    enabled: true
    drafts: false
    # Review PRs into any branch, as Sourcery does; review-only PRs target throwaway bases.
    base_branches:
      - '.*'
  path_filters:
    # Deliberately vulnerable apps that Loadwise must detect, and generated benchmark output.
    - '!bench/recall/cases/**'
    - '!bench/corpus/scores.json'
    - '!package-lock.json'
    # Third-party code vendored as is.
    - '!lib/performance/vendor/**'
  path_instructions:
    - path: '**/*.{ts,cts}'
      instructions: >-
        Follow CONTRIBUTING.md: no `any`, no non-null `!`, no `as` type assertions except `as const` (import and
        export aliases are fine), relative imports use the emitted file's extension
        (`.js` from `.ts`, `.cjs` from `.cts`), descriptive names. A rule or autofix change needs positive and negative tests and a matching rule page in `docs/rules/`.
    - path: 'lib/**'
      instructions: >-
        Loadwise is precision-first: a false positive costs more than a missed detection. Label a suggestion that
        only widens recall (a missed case, a new syntax family) as optional and non-blocking. Reserve Major or
        Critical for false positives, crashes, wrong output, wrong fixes and security holes.
    - path: 'changes/**'
      instructions: >-
        Each file except changes/README.md, which documents the format, is a changelog fragment. Check that `section` is one of Added, Changed,
        Deprecated, Removed, Fixed or Security and that the text matches what the pull request changes.
        CHANGELOG.md is edited only at release, by `npm run changelog`; do not ask for entries in it.
