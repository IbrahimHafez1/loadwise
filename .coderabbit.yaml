# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    # Deliberately vulnerable apps that Loadwise must detect, and generated benchmark output.
    - '!bench/recall/cases/**'
    - '!bench/corpus/scores.json'
    - '!package-lock.json'
  path_instructions:
    - path: '**/*.{ts,cts}'
      instructions: >-
        Follow CONTRIBUTING.md: no `any`, no non-null `!`, no `as` except `as const`, `.js` extensions on relative
        imports, descriptive names. A rule or autofix change needs positive and negative tests and matching README docs.
