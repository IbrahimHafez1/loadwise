version: 2
updates:
  - package-ecosystem: npm
    # The ORM integration fixture pins real driver versions, so it gets security and version updates too.
    directories: ['/', '/test/performance/integration/orms']
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      native-typescript:
        patterns: ['@typescript/typescript-*']
    ignore:
      # TypeScript 7 removed the JavaScript compiler API the checkers are built on.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The native engine binaries must match the vendored API in lib/performance/vendor/typescript and each other, so
      # they move together by hand; Dependabot proposed per-platform nightlies.
      - dependency-name: '@typescript/typescript-*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
