version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      native-typescript:
        patterns: ['@typescript/typescript-*']
    ignore:
      # TypeScript 7 removed the JavaScript compiler API the checkers are built on.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
