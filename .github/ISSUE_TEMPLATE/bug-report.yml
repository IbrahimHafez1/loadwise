name: Bug report
description: A crash, a wrong fix, a missed issue or a command that misbehaves.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the command you ran and the output or error. For a wrong fix, include the code before and after.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Loadwise version
      description: Output of `npx loadwise --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and operating system
    validations:
      required: true
