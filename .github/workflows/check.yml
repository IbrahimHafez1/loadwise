name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its superseded run, but every commit merged to main gets its own group so
# each one finishes with a result.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: check (ubuntu-latest, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  # Windows is the slowest runner, so its tests are split across three jobs. It runs the newest Node only; Node-version
  # differences already show on Ubuntu, which also runs the formatting and lint checks.
  windows:
    name: tests (windows-latest, node 24, shard ${{ matrix.shard }}/3)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-tests.js --test-shard=${{ matrix.shard }}/3

  # macOS has case-insensitive paths, /private/var temp folders and its own native TypeScript binary, so it runs the
  # whole suite and the native engine's performance tests.
  macos:
    name: tests (macos-latest, node 24)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-tests.js
      - run: node --import ./test/manual-session.js --test --test-concurrency=2 test/performance/*.test.js
        env:
          PERF_CHECK_TEST_NATIVE: '1'

  native-engine:
    name: performance tests on the native engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --import ./test/manual-session.js --test --test-concurrency=2 test/performance/*.test.js
        env:
          PERF_CHECK_TEST_NATIVE: '1'

  # The one check the main branch requires, so jobs can be added, split or renamed without editing the ruleset.
  passed:
    name: CI passed
    if: always()
    needs: [check, windows, macos, native-engine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
