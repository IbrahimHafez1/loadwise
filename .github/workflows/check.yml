name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  native-engine:
    name: performance tests on the native engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 14/1574 tests fail on the native engine (1516 pass, 44 skipped) due to tsgo type/symbol
    # parity gaps vs. TS6 (collections-bounded-reducer, list-counts [2], memory-growth,
    # mongoose-patterns [2], offset-pagination, precision-signals, request-heavy-work,
    # review-loops, stream-errors, typeorm-updates [2], unbounded-request-limit).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --import ./test/manual-session.js --test --test-concurrency=2 test/performance/*.test.js
        env:
          PERF_CHECK_TEST_NATIVE: '1'
