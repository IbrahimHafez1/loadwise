name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # Write access only where the release needs it: the GitHub release and v0 tag, and the npm OIDC token.
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check
      - run: npm run bench:recall
      # npm Trusted Publishing authenticates this workflow through OIDC (id-token: write), so no token secret is stored.
      - name: Publish to npm
        run: |
          # A re-run, or a version published by hand, skips straight to the release steps.
          if npm view "loadwise@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
            echo "loadwise@${GITHUB_REF_NAME#v} is already on npm"
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
      # Workflows pin the Action as `uses: IbrahimHafez1/loadwise@v0`, so a stable 0.x release moves that tag.
      - name: Move the v0 Action tag
        if: startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-')
        run: |
          git tag -f v0
          git push -f origin v0
