name: loadwise
description: Check TypeScript and JavaScript backends for query performance, transaction usage and maintainability problems.
branding:
  icon: check-circle
  color: blue

inputs:
  checkers:
    description: Comma-separated checkers passed to --only (perf, maint). Empty runs all of them.
    default: ''
  path:
    description: Directory to check, relative to the workspace.
    default: '.'
  changed-only:
    description: Set to true to check only lines changed since the pull request base commit.
    default: 'false'
  fail-on:
    description: Passed to --fail-on (contract or all). Empty keeps each checker's own default.
    default: ''
  upload-sarif:
    description: Set to true to upload the findings to GitHub code scanning. The job needs the security-events write permission.
    default: 'true'
  annotations:
    description: Set to true to print findings as workflow annotations on the pull request.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Run loadwise
      id: loadwise
      shell: bash
      env:
        LOADWISE_ACTION_PATH: ${{ github.action_path }}
        LOADWISE_CHECKERS: ${{ inputs.checkers }}
        LOADWISE_PATH: ${{ inputs.path }}
        LOADWISE_CHANGED_ONLY: ${{ inputs.changed-only }}
        LOADWISE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        LOADWISE_FAIL_ON: ${{ inputs.fail-on }}
        LOADWISE_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        LOADWISE_ANNOTATIONS: ${{ inputs.annotations }}
      run: |
        version=$(node -p "require(process.env.LOADWISE_ACTION_PATH + '/package.json').version")
        arguments=(check "$LOADWISE_PATH")
        [ -n "$LOADWISE_CHECKERS" ] && arguments+=(--only "$LOADWISE_CHECKERS")
        [ "$LOADWISE_CHANGED_ONLY" = "true" ] && [ -n "$LOADWISE_BASE_SHA" ] && arguments+=(--changed-since "$LOADWISE_BASE_SHA")
        [ -n "$LOADWISE_FAIL_ON" ] && arguments+=(--fail-on "$LOADWISE_FAIL_ON")
        exit_code=0
        if [ "$LOADWISE_UPLOAD_SARIF" = "true" ]; then
          npx --yes "@loadwise/cli@$version" "${arguments[@]}" --format sarif > "$RUNNER_TEMP/loadwise.sarif" || exit_code=$?
        fi
        if [ "$LOADWISE_ANNOTATIONS" = "true" ]; then
          npx --yes "@loadwise/cli@$version" "${arguments[@]}" --format github || exit_code=$?
        elif [ "$LOADWISE_UPLOAD_SARIF" != "true" ]; then
          npx --yes "@loadwise/cli@$version" "${arguments[@]}" || exit_code=$?
        fi
        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles(format('{0}/loadwise.sarif', runner.temp)) != '' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ runner.temp }}/loadwise.sarif

    - name: Apply loadwise exit code
      if: ${{ always() && steps.loadwise.outputs.exit-code != '0' }}
      shell: bash
      env:
        LOADWISE_EXIT_CODE: ${{ steps.loadwise.outputs.exit-code }}
      run: exit "${LOADWISE_EXIT_CODE:-1}"
