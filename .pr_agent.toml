# CodeRabbit and Sourcery review pull requests automatically (within their own draft and path filters).
# Qodo and Greptile are standby reviewers that run only when asked, for example when one of the others
# is down: comment `/agentic_review` for Qodo or mention `@greptileai` for Greptile.
# Keep the Qodo portal's "Code review trigger" on "Manual only" to match; greptile.json sets Greptile's.

[github_app]
# No review or summary when a pull request opens; CodeRabbit already writes the summary.
pr_commands = []
# No re-review on each push.
handle_push_trigger = false
push_commands = []
# Dependabot and other bot pull requests are not worth a third review.
ignore_bot_pr = true

[review_agent]
# A requested review posts once, without a temporary progress comment or "updated" notices.
publish_in_progress_comment = false
persistent_comment_notification = false
