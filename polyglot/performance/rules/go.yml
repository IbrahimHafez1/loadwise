id: go-fixed-regexp-in-loop
language: Go
severity: warning
labels:
  PAT:
    style: primary
message: This loop recompiles a fixed regexp pattern. Compile it once and reuse the result while preserving error handling.
rule:
  all:
    - any:
        - pattern:
            context: 'func check() { _ = regexp.Compile($PAT) }'
            selector: call_expression
        - pattern:
            context: 'func check() { _ = regexp.MustCompile($PAT) }'
            selector: call_expression
    - inside:
        kind: for_statement
        field: body
        stopBy:
          kind: func_literal
    - inside:
        kind: source_file
        stopBy: end
        has:
          kind: import_spec
          regex: '^"regexp"$'
          stopBy: end
    - not:
        inside:
          any: [{ kind: function_declaration }, { kind: method_declaration }, { kind: func_literal }]
          stopBy: end
          has:
            stopBy: end
            any:
              - any: [{ kind: parameter_declaration }, { kind: var_spec }]
                has: { field: name, regex: '^regexp$' }
              - any: [{ kind: short_var_declaration }, { kind: range_clause }]
                has:
                  field: left
                  kind: expression_list
                  has: { kind: identifier, regex: '^regexp$' }
constraints:
  PAT:
    any:
      - kind: interpreted_string_literal
      - kind: raw_string_literal

---
id: go-sql-query-in-loop
language: Go
severity: warning
message: SQL query or statement executed inside a loop can cause N+1 database round-trips. Batch the query outside the loop.
rule:
  all:
    - any:
        - pattern:
            context: 'func check() { _ = $DB.Query($$$ARGS) }'
            selector: call_expression
        - pattern:
            context: 'func check() { _ = $DB.QueryContext($$$ARGS) }'
            selector: call_expression
        - pattern:
            context: 'func check() { _ = $DB.QueryRow($$$ARGS) }'
            selector: call_expression
        - pattern:
            context: 'func check() { _ = $DB.QueryRowContext($$$ARGS) }'
            selector: call_expression
        - pattern:
            context: 'func check() { _ = $DB.Exec($$$ARGS) }'
            selector: call_expression
        - pattern:
            context: 'func check() { _ = $DB.ExecContext($$$ARGS) }'
            selector: call_expression
    - inside:
        kind: for_statement
        field: body
        stopBy:
          kind: func_literal

---
id: go-string-concat-in-loop
language: Go
severity: warning
message: Concatenating strings inside a loop allocates a new string on every iteration. Use strings.Builder instead.
rule:
  all:
    - any:
        - pattern: $ACC += $VAL
        - pattern: $ACC = $ACC + $VAL
    - inside:
        kind: for_statement
        field: body
        stopBy:
          kind: func_literal
    - any:
        - all:
            - pattern: $ACC += $LIT
            - has:
                field: right
                any:
                  - kind: interpreted_string_literal
                  - kind: raw_string_literal
        - all:
            - pattern: $ACC = $ACC + $LIT
            - has:
                field: right
                has:
                  any:
                    - kind: interpreted_string_literal
                    - kind: raw_string_literal
                  stopBy: end
        - inside:
            any:
              - kind: function_declaration
              - kind: method_declaration
              - kind: func_literal
            stopBy: end
            has:
              stopBy: end
              any:
                - pattern: $ACC := ""
                - pattern: var $ACC string
