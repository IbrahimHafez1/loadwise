id: python-copy-growing-list
language: Python
severity: warning
labels:
  ACC:
    style: primary
message: Rebuilding this list for each item can copy a growing prefix each time. Use append when earlier list identities do not need to be preserved.
rule:
  all:
    - pattern: $ACC = $ACC + [$VALUE]
    - inside:
        stopBy:
          kind: function_definition
        all:
          - pattern: |
              for $ITEM in $ITER:
                  $ACC = $ACC + [$VALUE]
          - not:
              pattern: |
                for $ACC in $ITER:
                    $ACC = $ACC + [$VALUE]
          - follows:
              pattern:
                context: $ACC = []
                selector: expression_statement
constraints:
  ACC:
    kind: identifier
  ITEM:
    kind: identifier
  ITER:
    not:
      all:
        - any:
            - pattern: '[]'
            - pattern: '[$ONLY]'
            - pattern: '()'
            - pattern: '($ONLY,)'
        - not:
            has: { kind: list_splat }

---
id: python-sync-requests-in-async
language: Python
severity: warning
message: Blocking requests call inside an async function stalls the asyncio event loop. Use httpx.AsyncClient or aiohttp instead.
rule:
  all:
    - any:
        - pattern: requests.get($$$ARGS)
        - pattern: requests.post($$$ARGS)
        - pattern: requests.put($$$ARGS)
        - pattern: requests.patch($$$ARGS)
        - pattern: requests.delete($$$ARGS)
        - pattern: requests.request($$$ARGS)
    - inside:
        kind: function_definition
        regex: '^async\s'
        stopBy:
          kind: function_definition

---
id: python-blocking-sleep-in-async
language: Python
severity: warning
message: time.sleep blocks the asyncio event loop inside an async function. Use await asyncio.sleep instead.
rule:
  all:
    - pattern: time.sleep($$$ARGS)
    - inside:
        kind: module
        stopBy: end
        has:
          kind: import_statement
          stopBy: end
          has:
            kind: dotted_name
            regex: '^time$'
    - inside:
        kind: function_definition
        regex: '^async\s'
        stopBy:
          kind: function_definition

---
id: python-fixed-regex-in-loop
language: Python
severity: warning
labels:
  PAT:
    style: primary
message: This loop compiles a fixed regex for each iteration. Compile it once outside the loop and reuse the pattern.
rule:
  all:
    - pattern: re.compile($PAT)
    - inside:
        kind: module
        stopBy: end
        has:
          kind: import_statement
          stopBy: end
          has:
            kind: dotted_name
            regex: '^re$'
    - inside:
        any:
          - kind: for_statement
          - kind: while_statement
        field: body
        stopBy:
          any:
            - kind: function_definition
            - kind: lambda
            - kind: class_definition
constraints:
  PAT:
    kind: string

---
id: python-n-plus-one-orm-loop
language: Python
severity: warning
message: Database or ORM query executed inside a loop can cause N+1 query overhead. Batch or prefetch before the loop.
rule:
  all:
    - any:
        - pattern: session.query($$$ARGS)
        - pattern: session.execute($$$ARGS)
        - pattern: session.scalars($$$ARGS)
        - pattern: cursor.execute($$$ARGS)
        - pattern: $MODEL.objects.get($$$ARGS)
        - pattern: $MODEL.objects.filter($$$ARGS)
        - pattern: $MODEL.objects.all()
    - inside:
        any:
          - kind: for_statement
          - kind: while_statement
        field: body
        stopBy:
          any:
            - kind: function_definition
            - kind: lambda
            - kind: class_definition

---
id: python-unbounded-comprehension
language: Python
severity: warning
message: Materializing a list comprehension inside an aggregation allocates the full list in memory. Use a generator expression instead.
rule:
  any:
    - pattern: sum($COMP)
    - pattern: any($COMP)
    - pattern: all($COMP)
    - pattern: min($COMP)
    - pattern: max($COMP)
constraints:
  COMP:
    kind: list_comprehension
